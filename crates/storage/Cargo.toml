[package]
name = "rq-tui-storage"
version = "0.1.0"
edition = "2021"

[lib]
name = "rq_tui_storage"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rq-tui-domain = { path = "../domain" }
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
