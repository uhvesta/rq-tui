[package]
name = "rq-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rq-tui"
path = "src/main.rs"

[[bin]]
name = "rev"
path = "src/rev_main.rs"

[workspace]
resolver = "2"
members = ["crates/app", "crates/domain", "crates/github_review", "crates/storage", "crates/tui_text"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
github-copilot-sdk = { version = "1.0.8", default-features = false }
rq-tui-domain = { path = "crates/domain" }
rq-tui-github-review = { path = "crates/github_review" }
rq-tui-app = { path = "crates/app" }
rq-tui-storage = { path = "crates/storage" }
rq-tui-text = { path = "crates/tui_text" }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
similar = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"

[dev-dependencies]
pretty_assertions = "1"
