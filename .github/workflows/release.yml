name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-aarch64
            os: macos-15

    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-9-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock', '**/*.bzl') }}
          restore-keys: bazel-9-${{ runner.os }}-${{ runner.arch }}-
      - name: Test
        run: bazel test //:rq_tui_tests
      - name: Build
        run: bazel build //:rq-tui
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp "bazel-bin/src/rq-tui" "dist/rq-tui-${{ matrix.name }}"
          tar -C dist -czf "rq-tui-${{ matrix.name }}.tar.gz" "rq-tui-${{ matrix.name }}"
          shasum -a 256 "rq-tui-${{ matrix.name }}.tar.gz" > "rq-tui-${{ matrix.name }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rq-tui-${{ matrix.name }}
          path: |
            rq-tui-${{ matrix.name }}.tar.gz
            rq-tui-${{ matrix.name }}.tar.gz.sha256

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rq-tui-*
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes
